<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Messe Guide 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0e17">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=19">
  <link rel="stylesheet" href="css/theme-neon.css" id="theme-css">
  <script>
    // Theme vor dem ersten Rendern anwenden (kein Aufblitzen des Standard-Designs)
    (function () {
      var t = localStorage.getItem("aimg2026_theme");
      if (t && t !== "neon") document.getElementById("theme-css").href = "css/theme-" + t + ".css";
    })();
  </script>
</head>
<body>
  <nav class="sidebar">
    <div class="logo">
      <div class="logo-icon" data-ico="bot"></div>
      <div><b>AI Messe Guide</b><span>Deutschland 2026</span></div>
    </div>
    <div class="navlink" data-view="dashboard" data-ico="dashboard">Dashboard</div>
    <div class="navlink" data-view="kalender" data-ico="kalender">Kalender</div>
    <div class="navlink" data-view="auswahl" data-ico="auswahl">Auswahlliste</div>
    <div class="navlink" data-view="events" data-ico="events">Veranstaltungen</div>
    <div class="navlink" data-view="kosten" data-ico="kosten">Kosten</div>
    <div class="navlink" data-view="community" data-ico="community">Community</div>
    <div class="navlink" data-view="nachrichten" data-ico="nachrichten">Nachrichten<span id="dm-badge"></span></div>
    <div class="navlink" data-view="posts" data-ico="posts">Posts</div>
    <div id="login-bereich" class="login-bereich"></div>
    <div class="theme-leiste">
      <button class="theme-knopf" data-theme="neon" data-ico="theme-neon" onclick="A.theme('neon')" title="Design: Neon Deep"></button>
      <button class="theme-knopf" data-theme="editorial" data-ico="theme-editorial" onclick="A.theme('editorial')" title="Design: Editorial Light"></button>
      <button class="theme-knopf" data-theme="clean" data-ico="theme-clean" onclick="A.theme('clean')" title="Design: Corporate Clean"></button>
    </div>
    <div class="sidebar-fuss">
      Daten lokal im Browser gespeichert<br>(LocalStorage + IndexedDB)<br>
      <a href="datenschutz.html">Datenschutz</a> · <a href="rechtliches.html">Impressum / EU AI Act</a>
    </div>
  </nav>

  <main id="main"></main>
  <div id="modal-wrap"></div>

  <!-- ?v= beim Ändern der Dateien hochzählen: erzwingt frische Skripte statt Browser-Cache -->
  <script src="js/config.js?v=19" onerror="console.info('Kein config.js – lokaler Modus.')"></script>
  <script src="js/icons.js?v=19"></script>
  <script src="js/data.js?v=19"></script>
  <script src="js/karte.js?v=19"></script>
  <script src="js/auswahl.js?v=19"></script>
  <script src="js/db.js?v=19"></script>
  <script src="js/cloud.js?v=19"></script>
  <script src="js/app.js?v=19"></script>
  <script>
    // PWA: Service Worker registrieren (Offline-Betrieb, "Zum Startbildschirm hinzufügen")
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(e => console.info("Service Worker:", e.message));
    }
  </script>
</body>
</html>
